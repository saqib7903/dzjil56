services:
  backend:
    build: ./backend
    environment:
      # auto = bundled January snapshot; set to "live" to pull from Elexon on start-up
      DATA_SOURCE: ${DATA_SOURCE:-auto}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
